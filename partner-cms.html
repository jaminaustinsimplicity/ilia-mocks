<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partner Hub CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f3f5f9; --surface:#fff; --surface-2:#eef1f6; --ink:#121826; --ink-2:#4d566b; --ink-3:#7a8399; --line:#dfe3ec;
  --brand:#1f5fd1; --brand-ink:#fff; --brand-soft:#e7eefb;
  --side:#121a2c; --side-ink:#c9d1e3; --side-act:#24304a;
  --boost:#e0661f; --boost-soft:#fdeee4; --good:#17864a; --good-soft:#e3f4ea; --warn:#a86d12; --warn-soft:#fbf1dc; --bad:#c2364a; --bad-soft:#fbe6e9;
  --groups:#7b5cd6; --groups-soft:#f1edfc;
  --demo:#0b0f18; --demo-ink:#e8ebf2;
  --shadow:0 1px 2px rgba(18,24,38,.06),0 8px 24px rgba(18,24,38,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1118; --surface:#161b26; --surface-2:#1d2330; --ink:#e8ebf2; --ink-2:#a6aec1; --ink-3:#7f879b; --line:#2a3142;
    --brand:#5b9be8; --brand-ink:#0b1220; --brand-soft:#16273d; --side:#0a0f19; --side-ink:#b9c2d6; --side-act:#1b2436;
    --boost:#f28a4c; --boost-soft:#35231a; --good:#4cc07c; --good-soft:#15301f; --warn:#e2a94a; --warn-soft:#33281a; --bad:#f06b7d; --bad-soft:#361a20;
    --groups:#a68cf0; --groups-soft:#241e3a; --demo:#000; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1118; --surface:#161b26; --surface-2:#1d2330; --ink:#e8ebf2; --ink-2:#a6aec1; --ink-3:#7f879b; --line:#2a3142;
  --brand:#5b9be8; --brand-ink:#0b1220; --brand-soft:#16273d; --side:#0a0f19; --side-ink:#b9c2d6; --side-act:#1b2436;
  --boost:#f28a4c; --boost-soft:#35231a; --good:#4cc07c; --good-soft:#15301f; --warn:#e2a94a; --warn-soft:#33281a; --bad:#f06b7d; --bad-soft:#361a20;
  --groups:#a68cf0; --groups-soft:#241e3a; --demo:#000; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* Demo bar */
.demobar{position:fixed;top:0;left:0;right:0;height:46px;z-index:100;background:var(--demo);color:var(--demo-ink);display:flex;align-items:center;gap:10px;padding:0 12px;font-size:13px;overflow-x:auto;white-space:nowrap}
.demobar a{color:#9cc2ff;font-weight:700;text-decoration:none;padding:5px 10px;border-radius:7px;background:#1b2436}
.demobar .lbl{opacity:.65;margin-left:6px}
.demobar .seg{display:inline-flex;background:#1b2436;border-radius:8px;padding:2px}
.demobar .seg button{border:0;background:transparent;color:#c9d1e3;font-weight:600;font-size:12.5px;padding:5px 10px;border-radius:6px;cursor:pointer}
.demobar .seg button[aria-pressed=true]{background:#e8ebf2;color:#0b0f18}
.demobar .rst{border:1px solid #2c3750;background:transparent;color:#c9d1e3;font-weight:600;font-size:12.5px;padding:5px 10px;border-radius:7px;cursor:pointer}
.demobar .tag{margin-left:auto;opacity:.55;font-size:12px}

/* Stage */
#stage{position:fixed;top:46px;left:0;right:0;bottom:0;overflow:hidden}
#stage.mobile{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,var(--surface-2),var(--bg))}
.phone{width:100%;height:100%}
#stage.mobile .phone{width:390px;height:min(820px,calc(100% - 28px));border-radius:36px;border:11px solid #1b2130;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative}
#portal{height:100%;display:grid;grid-template-columns:236px 1fr;background:var(--bg);position:relative}
#stage.mobile #portal{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}

/* Sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px}
.brand .mk{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#3b82f6,#7b5cd6);display:grid;place-items:center;color:#fff;font-weight:800}
.brand b{display:block;color:#fff;font-size:14.5px;line-height:1.2}
.brand small{font-size:11.5px;opacity:.7}
.rolechip{margin:0 6px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:6px;background:#24304a;color:#cfe0ff;align-self:flex-start}
.nav button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--side-ink);padding:9px 10px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;text-align:left}
.nav button:hover{background:#1a2338}
.nav button[aria-current=page]{background:var(--side-act);color:#fff}
.nav .ic{width:20px;text-align:center}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 6px 0;border-top:1px solid #222c42}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#fff;flex:none;background:#5b6b8c}
.me b{display:block;color:#fff;font-size:13px}
.me small{font-size:11.5px;opacity:.7}

/* Mobile chrome */
.mtop{display:none}
.mtabs{display:none}
#stage.mobile .side{display:none}
#stage.mobile .mtop{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--side);color:#fff}
#stage.mobile .mtop .brand{padding:0}
#stage.mobile .mtop .av{margin-left:auto;width:30px;height:30px;font-size:11px}
#stage.mobile .mtabs{display:flex;background:var(--surface);border-top:1px solid var(--line)}
.mtabs button{flex:1;border:0;background:transparent;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--ink-3);cursor:pointer;position:relative}
.mtabs button .ic{font-size:18px}
.mtabs button[aria-current=page]{color:var(--brand)}
.mtabs .cnt{position:absolute;top:4px;right:calc(50% - 20px);background:var(--bad);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:0 5px}

/* Main */
.main{overflow-y:auto;min-width:0}
.mainin{max-width:1180px;margin:0 auto;padding:26px 28px 60px}
#stage.mobile .mainin{padding:16px 14px 30px}
.phead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.phead h1{margin:0;font-size:24px;letter-spacing:-.01em;line-height:1.2}
#stage.mobile .phead h1{font-size:20px}
.phead p{margin:2px 0 0;color:var(--ink-2)}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
#stage.mobile .phead .acts{margin-left:0;width:100%}
.crumbs{font-size:12.5px;color:var(--ink-3);margin-bottom:4px}
.crumbs button{border:0;background:none;color:var(--brand);font-weight:600;padding:0;cursor:pointer}

.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--good);color:#fff}
.btn.no{background:var(--surface);color:var(--bad);border:1px solid var(--line)}
.btn.boost{background:var(--boost);color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%;justify-content:center}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:0;cursor:pointer}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:1fr 1fr} .g21{grid-template-columns:2fr 1fr}
#stage.mobile .g4{grid-template-columns:1fr 1fr} #stage.mobile .g3,#stage.mobile .g2,#stage.mobile .g21{grid-template-columns:1fr}
@media (max-width:900px){ .g4{grid-template-columns:1fr 1fr} .g3,.g2,.g21{grid-template-columns:1fr} }
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 2px;font-size:15px}
.card .sub{color:var(--ink-3);font-size:12.5px;margin:0 0 12px}
.stat{padding:14px 16px}
.stat span{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
.stat b{display:block;font-size:26px;letter-spacing:-.02em;line-height:1.2}
.stat small{font-size:12px;color:var(--good);font-weight:600}
.stat.kz b{color:var(--boost)}

/* Funnel bars */
.fun{display:grid;gap:8px}
.fun .r{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:13px}
#stage.mobile .fun .r{grid-template-columns:104px 1fr 44px;font-size:12px}
.fun .tr{height:22px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex}
.fun .tr div{height:100%;background:var(--brand);border-radius:6px 0 0 6px}
.fun .tr div.kz{background:var(--boost);border-radius:0}
.fun .r b{text-align:right}

/* Rows (responsive table) */
.rows{display:grid}
.rows .hd,.rows .rw{display:grid;gap:10px;align-items:center;padding:10px 12px}
.rows .hd{font-size:11.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
.rows .rw{border-bottom:1px solid var(--line);font-size:13.5px}
.rows .rw:last-child{border-bottom:0}
.rows .rw.click{cursor:pointer} .rows .rw.click:hover{background:var(--surface-2)}
.rows .cell small{display:block;color:var(--ink-3);font-size:12px}
.rows .cl{display:none}
#stage.mobile .rows .hd{display:none}
#stage.mobile .rows .rw{grid-template-columns:1fr 1fr !important;gap:6px 10px;padding:12px 4px}
#stage.mobile .rows .rw .cell:first-child{grid-column:1 / -1;font-weight:700}
#stage.mobile .rows .cl{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700}
.tablecard{padding:6px 6px}

.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--brand-soft);color:var(--brand)} .p-kz{background:var(--boost-soft);color:var(--boost)} .p-mute{background:var(--surface-2);color:var(--ink-3)} .p-grp{background:var(--groups-soft);color:var(--groups)}

/* Forms */
.f{margin-bottom:14px}
.f label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.f textarea{min-height:84px;resize:vertical}
.f .hint{font-size:12px;color:var(--ink-3);margin-top:4px}
.demo-tip{font-size:12px;color:var(--brand);margin:0 0 12px}
.choices{display:grid;gap:8px}
.chc{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer}
.chc[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft)}
.chc b{display:block}
.chc small{color:var(--ink-3)}
.typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#stage.mobile .typegrid{grid-template-columns:1fr 1fr}
.typegrid button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 8px;cursor:pointer;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.typegrid button span{font-size:22px}
.typegrid button[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}

/* Modal / sheet */
.mback{position:absolute;inset:0;background:rgba(8,12,20,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:16px;width:min(560px,100%);max-height:calc(100% - 20px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{width:min(760px,100%)}
#stage.mobile .mback{align-items:flex-end;padding:0}
#stage.mobile .modal{border-radius:20px 20px 0 0;max-height:92%}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.mh h3{margin:0;font-size:16px}
.mh .x{margin-left:auto;border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:17px}
.mb{padding:16px 18px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
#stage.mobile .mf .btn{flex:1;justify-content:center}

/* Toast */
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90%;text-align:center}
#stage.mobile .toast{bottom:84px}

/* Link/QR */
.linkcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
#stage.mobile .linkcard{grid-template-columns:1fr;justify-items:center;text-align:center}
.qr{background:#fff;padding:8px;border-radius:10px;border:1px solid var(--line);display:inline-block;line-height:0}
.qr canvas,.qr img{display:block}
.qrfail{width:120px;height:120px;display:grid;place-items:center;font-size:11px;color:#666;text-align:center}
.url{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--surface-2);border-radius:8px;padding:8px 10px;word-break:break-all;color:var(--ink-2)}
.idchip{font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:700;background:var(--surface-2);border-radius:6px;padding:2px 7px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#stage.mobile .linkcard .btnrow{justify-content:center}

/* Agent cards */
.agcard{display:flex;gap:12px;align-items:flex-start}
.agcard .av{width:44px;height:44px;font-size:15px}
.agcard b{display:block;font-size:15px}
.agcard small{display:block;color:var(--ink-3)}
.agmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* Wizard */
.wiz{max-width:640px;margin:0 auto}
.steps{display:flex;gap:6px;margin:0 0 20px}
.steps div{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--brand)}
.wiz h2{margin:0 0 4px;font-size:24px;letter-spacing:-.01em}
.wiz .lead{color:var(--ink-2);margin:0 0 18px}
.welcome{display:flex;gap:14px;align-items:center;background:var(--groups-soft);border-radius:14px;padding:14px;margin-bottom:16px}
.welcome .gl{width:46px;height:46px;border-radius:12px;background:var(--groups);color:#fff;display:grid;place-items:center;font-weight:800}

.banner{display:flex;gap:12px;align-items:center;border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13.5px}
.banner.info{background:var(--brand-soft)} .banner.warn{background:var(--warn-soft)} .banner.ok{background:var(--good-soft)}
.banner .btn{margin-left:auto}
#stage.mobile .banner{flex-wrap:wrap} #stage.mobile .banner .btn{margin-left:0}
.empty{text-align:center;color:var(--ink-3);padding:24px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv span{color:var(--ink-3)}
.leader{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.leader:last-child{border:0}
.leader .bar{flex:1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.leader .bar div{height:100%;background:var(--groups)}
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.chipsel button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.chipsel button[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.tpl{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:8px}
.tpl b{display:block;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.preview-ad{border:1px solid var(--line);border-radius:12px;padding:14px;background:linear-gradient(135deg,var(--brand-soft),var(--surface))}
.preview-ad h4{margin:0 0 4px;font-size:17px}
.preview-ad p{margin:0 0 10px;color:var(--ink-2);font-size:13px}
@media (max-width:480px){ #stage.mobile .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none} }
</style>
</head>
<body>
<div class="demobar" role="toolbar" aria-label="Demo controls">
  <a href="partner-iul-kaizen-workflow.html">← Mock master</a>
  <span class="lbl">Viewing as</span>
  <div class="seg" id="roleSeg">
    <button data-role="admin">NIW Admin</button>
    <button data-role="leader">Group Leader</button>
    <button data-role="member">Group Member</button>
  </div>
  <div class="seg" id="devSeg">
    <button data-dev="web">🖥 Web</button>
    <button data-dev="mobile">📱 Mobile</button>
  </div>
  <button class="rst" id="reset">↺ Reset demo</button>
  <span class="tag">Partner Hub CMS · clickable prototype · demo data only</span>
</div>
<div id="stage"><div class="phone"><div id="portal"></div></div></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
const COLORS=['#5b6bd6','#0e9f8a','#d9622b','#7b5cd6','#2b8ac2','#c2364a','#3c8a3f','#a8641f'];
const colorFor=s=>COLORS[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const av=(n,cls='')=>`<div class="av ${cls}" style="background:${colorFor(n)}">${initials(n)}</div>`;
const funnelBase=()=>{ try{ return new URL('partner-iul-funnel.html',location.href).href; }catch(e){ return 'partner-iul-funnel.html'; } };

// ---------------- Seed data (all fictional) ----------------
function seed(){
  const agents=[
    {id:'A1',iliaId:'ILIA-AG-1042',name:'Dana Whitfield',email:'dana.whitfield@example.com',phone:'(555) 010-1042',state:'TX',groups:['G1','G2'],bio:'IUL + Kai-Zen specialist, 12 yrs'},
    {id:'A2',iliaId:'ILIA-AG-2087',name:'Marcus Lee',email:'marcus.lee@example.com',phone:'(555) 010-2087',state:'FL',groups:['G1'],bio:'Retirement income planning, 8 yrs'},
    {id:'A3',iliaId:'ILIA-AG-3311',name:'Priya Shah',email:'priya.shah@example.com',phone:'(555) 010-3311',state:'CA',groups:['G2'],bio:'Business owners + executives, 10 yrs'}];
  const groups=[
    {id:'G1',name:'Summit Ridge Partners',type:'Financial advisory firm',status:'active',contact:'Lena Ortiz',since:'Aug 2026'},
    {id:'G2',name:'Harborview Collective',type:'Benefits association',status:'active',contact:'Victor Hale',since:'Sep 2026'},
    {id:'G3',name:'Northline Advisors Group',type:'Independent advisors',status:'requested',contact:'Grace Kim',since:'—'}];
  const users=[
    {id:'L1',name:'Lena Ortiz',email:'lena.ortiz@example.com',group:'G1',role:'leader',status:'active',agent:'A1'},
    {id:'M1',name:'Chris Patel',email:'chris.patel@example.com',group:'G1',role:'member',status:'active',agent:'A1'},
    {id:'M2',name:'Tasha Green',email:'tasha.green@example.com',group:'G1',role:'member',status:'active',agent:'A2'},
    {id:'M3',name:'Owen Brooks',email:'owen.brooks@example.com',group:'G1',role:'member',status:'active',agent:'A1'},
    {id:'M4',name:'Sam Rivera',email:'sam.rivera@example.com',group:'G1',role:'member',status:'invited',agent:null},

function render(){

  const navBtns=nav.map(([k,ic,l])=>`<button data-nav="${k}" ${UI.screen===k?'aria-current="page"':''} ${onboarding?'disabled':''}><span class="ic">${ic}</span>${l}${k==='approvals'&&pend?`<span class="cnt">${pend}</span>`:''}</button>`).join('');
  const screens=role==='admin'?ADMIN:role==='leader'?LEADER:MEMBER;
  let content;
  if(onboarding){
    content=u.status==='pending'?`<div class="wiz"><h2>Waiting for approval</h2><p class="lead">Your invitation is waiting for NIW approval.</p></div>`:MEMBER.onboard();
  } else content=(screens[UI.screen]||screens[nav[0][0]])();
  let mod='';
  if(UI.modal){ const [n,p]=[UI.modal.name.split(':')[0],UI.modal.name.split(':').slice(1).join(':')||UI.modal.param]; mod=MODALS[n]?MODALS[n](p):''; }
  $('#portal').innerHTML=`
   <aside class="side"><div class="brand"><div class="mk">P</div><div><b>Partner Hub</b><small>IUL + Kai-Zen · by NIW</small></div></div>
     <span class="rolechip">${ROLE_LABEL[role]}</span><nav class="nav" aria-label="Main">${navBtns}</nav>
     <div class="me">${av(who.name)}<div><b>${esc(who.name)}</b><small>${esc(who.title)}</small></div></div></aside>
   <header class="mtop"><div class="brand"><div class="mk">P</div><div><b>Partner Hub</b><small>${ROLE_LABEL[role]}</small></div></div>${av(who.name)}</header>
   <main class="main"><div class="mainin">${content}</div></main>
   <nav class="mtabs" aria-label="Main">${onboarding?'':nav.map(([k,ic,l])=>`<button data-nav="${k}" ${UI.screen===k?'aria-current="page"':''}><span class="ic">${ic}</span>${l}${k==='approvals'&&pend?`<span class="cnt">${pend}</span>`:''}</button>`).join('')}</nav>
   ${mod}${UI.toast?`<div class="toast" role="status">${esc(UI.toast)}</div>`:''}`;
  document.querySelectorAll('#roleSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.role===role));
  document.querySelectorAll('#devSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dev===UI.dev));
  $('#stage').classList.toggle('mobile',UI.dev==='mobile');
  paintQR();
}
function keep(fn){ const m=$('.modal'), st=m?m.scrollTop:0, mm=$('.main'), ms=mm?mm.scrollTop:0; fn&&fn(); render(); const m2=$('.modal'); if(m2) m2.scrollTop=st; const mm2=$('.main'); if(mm2) mm2.scrollTop=ms; }
function need(list){ return list.split(',').every(k=>(UI.form[k]||'').trim()); }

// ---------------- Actions ----------------
function save(kind){
  const F=UI.form;
  if(kind==='addGroup'){ const id=nid('G'); DB.groups.push({id,name:F.gname,type:F.gtype,status:'invited',contact:F.gleader,since:'—'});
    DB.users.push({id:nid('L'),name:F.gleader,email:F.gemail,group:id,role:'leader',status:'invited',agent:null});
    Object.entries(F.agents||{}).forEach(([a,on])=>{ if(on) A(a).groups.push(id); }); go('groups',id); toast('Group created. Invite sent to '+F.gleader+'.'); return; }
  if(kind==='addAgent'){ const f=F._found, id=nid('A'); DB.agents.push({id,iliaId:f.iliaId,name:f.name,email:f.email,phone:'(555) 010-'+f.iliaId.slice(-4),state:f.state,groups:Object.keys(F.grps).filter(k=>F.grps[k]),bio:'Newly added'}); DB.ilia=DB.ilia.filter(x=>x.iliaId!==f.iliaId); UI.modal=null; render(); toast(f.name+' added as a group-related agent.'); return; }
  if(kind.startsWith('linkAgent')){ const gid=kind.split(':')[1]; A(F.agent).groups.push(gid); UI.modal=null; render(); toast(A(F.agent).name+' linked to '+G(gid).name+'.'); return; }
  if(kind==='invite'){ const u=me(), id=nid('M'); DB.users.push({id,name:F.iname,email:F.iemail,group:u.group,role:'member',status:'pending',agent:null,invitedBy:u.id});
    DB.approvals.unshift({id:nid('AP'),kind:'member',user:id,group:u.group,by:u.id,when:'just now'}); UI.modal=null; render(); toast('Sent to NIW for approval. Switch to NIW Admin to approve it.'); return; }
  if(kind==='createAsset'){ const u=me(), id='AS-0'+(DB.seq+=3); DB.assets.unshift({id,group:u.group,owner:u.id,type:F.type||'qr',name:F.aname,headline:F.ahead,msg:F.amsg,shared:UI.role==='leader'?F.shared!==false:false,created:'Today'});
    DB.links.push({id:nid('LK'),user:u.id,asset:id,clicks:0}); UI.modal=null; render(); toast('Asset '+id+' created'+(UI.role==='leader'&&F.shared!==false?' and shared with your team.':'.')); return; }
  if(kind==='newLink'){ const u=me(); let aid=F.asset;
    if((F.mode||'lib')==='own'){ aid='AS-0'+(DB.seq+=3); DB.assets.unshift({id:aid,group:u.group,owner:u.id,type:F.type||'text',name:F.aname,headline:F.ahead,msg:F.amsg,shared:false,created:'Today'}); }
    const L={id:nid('LK'),user:u.id,asset:aid,clicks:0}; DB.links.unshift(L); UI.modal={name:'share:'+L.id}; UI.form={}; render(); toast('Your link is ready.'); return; }
  if(kind==='changeAgent'){ const u=me(); u.agent=F.agent; UI.modal=null; render(); toast('New prospects will now go to '+A(F.agent).name+'.'); return; }
}
function approve(id){ const a=DB.approvals.find(x=>x.id===id);
  if(a.kind==='member'){ U(a.user).status='invited'; toast(U(a.user).name+' approved. Invite email sent.'); }
  else { const g=G(a.group); g.status='active'; g.since='Oct 2026'; Object.entries(UI.form.agents||{}).forEach(([k,on])=>{ if(on&&!A(k).groups.includes(g.id)) A(k).groups.push(g.id); });
    DB.users.push({id:nid('L'),name:a.by,email:a.email,group:g.id,role:'leader',status:'invited',agent:null}); toast(g.name+' approved. '+a.by+' invited as group leader.'); }
  DB.approvals=DB.approvals.filter(x=>x.id!==id); UI.modal=null; render(); }
function decline(id){ const a=DB.approvals.find(x=>x.id===id); if(a.kind==='member') DB.users=DB.users.filter(u=>u.id!==a.user); else G(a.group).status='declined';
  DB.approvals=DB.approvals.filter(x=>x.id!==id); UI.modal=null; render(); toast('Request declined.'); }
function simulate(){ const u=me(), L=DB.links.filter(l=>l.user===u.id); if(!L.length) return; const l=L[Math.floor(Math.random()*L.length)];
  const FN=['Hope','Ian','June','Kai','Leo','Mia','Noah','Ola'], LN=['Fox','Gray','Holt','Ives','Kane','Lowe'];
  const st=['results','learn','chose','ilia'][Math.floor(Math.random()*4)], kz=Math.random()>.35;
  l.clicks+=3; DB.leads.unshift({id:'P-'+(++DB.seq+6000),name:FN[Math.floor(Math.random()*8)]+' '+LN[Math.floor(Math.random()*6)],link:l.id,user:u.id,asset:l.asset,agent:u.agent,group:u.group,stage:st,product:(st==='chose'||st==='ilia')?(kz?'kz':'iul'):null,qual:kz,flag:null,contacted:Math.random()>.7,when:'just now'});
  keep(); toast('New prospect from '+l.asset+' → '+STAGE[st][0]+'.'); }

// ---------------- Events ----------------
document.addEventListener('click',e=>{
  const t=e.target;
  const rb=t.closest('[data-role]'); if(rb){ UI.role=rb.dataset.role; UI.screen=null; UI.param=null; UI.modal=null; UI.form={}; render(); return; }
  const db=t.closest('[data-dev]'); if(db){ UI.dev=db.dataset.dev; render(); return; }
  if(t.closest('#reset')){ DB=seed(); UI.screen=null; UI.param=null; UI.modal=null; UI.form={}; UI.memberStep=0; render(); toast('Demo data reset.'); return; }
  const inp=t.closest('#portal [data-f]');
  if(inp){ if(!inp.value&&inp.dataset.demo){ inp.value=inp.dataset.demo; UI.form[inp.dataset.f]=inp.value; if(inp.dataset.f==='ahead'||inp.dataset.f==='amsg') keep(); else refreshNeeds(); } return; }
  if(!t.closest('#portal')) return;
  const b=t.closest('button, a.btn, [data-nav]'); if(!b) return;
  const d=b.dataset;
  if(d.backdrop!==undefined&&t===b){ UI.modal=null; render(); return; }
  if(d.close){ UI.modal=null; render(); return; }
  if(d.nav){ const [s,p]=d.nav.split(':'); go(s,p); return; }
  if(d.open){ openModal(d.open); return; }
  if(d.approve){ if(b.disabled) return; approve(d.approve); return; }
  if(d.decline){ decline(d.decline); return; }
  if(d.unlink){ const [a,g]=d.unlink.split(':'); A(a).groups=A(a).groups.filter(x=>x!==g); keep(); toast('Agent unlinked. Members who chose them keep existing prospects.'); return; }
  if(d.save){ if(b.disabled) return; if(d.need&&!need(d.need)){ toast('Fill in the highlighted fields (tip: click a field for sample data).'); return; } save(d.save); return; }
  if(d.togag){ UI.form.agents=UI.form.agents||{}; UI.form.agents[d.togag]=!UI.form.agents[d.togag]; keep(); return; }
  if(d.toggrp){ UI.form.grps=UI.form.grps||{}; UI.form.grps[d.toggrp]=!UI.form.grps[d.toggrp]; keep(); return; }
  if(d.lookup){ const q=(UI.form.aq||'').trim().toLowerCase(); UI.form._found=DB.ilia.find(x=>x.email===q||x.iliaId.toLowerCase()===q)||false; keep(); return; }
  if(d.pick){ UI.form.agent=d.pick; keep(); return; }
  if(d.pickasset){ UI.form.asset=d.pickasset; keep(); return; }
  if(d.type){ UI.form.type=d.type; keep(); return; }
  if(d.mode){ UI.form.mode=d.mode; keep(); return; }
  if(d.copy){ try{ navigator.clipboard.writeText(d.copy); }catch(err){} toast('Link copied.'); return; }
  if(d.sim){ simulate(); return; }
  if(d.mstep!==undefined){ if(d.need&&!need(d.need)){ toast('Fill in your details first (tip: click a field for sample data).'); return; }
    const n=+d.mstep; if(n===3){ const u=me(); u.agent=UI.form.agent; if(!DB.links.some(l=>l.user===u.id)) DB.links.unshift({id:nid('LK'),user:u.id,asset:'AS-0047',clicks:0}); }
    if(n===2&&UI.form.mname) me().name=UI.form.mname;
    UI.memberStep=n; const keepAgent=UI.form.agent; const f=UI.form; render(); return; }
  if(d.mdone){ me().status='active'; UI.screen='home'; UI.form={}; render(); toast('Welcome aboard! Share your link to get your first lead.'); return; }
});
document.addEventListener('input',e=>{ const t=e.target; if(t.dataset&&t.dataset.f){ UI.form[t.dataset.f]=t.value; if(t.dataset.f==='ahead'||t.dataset.f==='amsg'){ const pv=$('.modal .preview-ad'); if(pv){ pv.querySelector('h4').textContent=UI.form.ahead||'Your headline'; pv.querySelector('p').textContent=UI.form.amsg||'Your message'; } } } });
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset&&t.dataset.f){ UI.form[t.dataset.f]=t.value; } if(t.dataset&&t.dataset.shared){ UI.form.shared=t.checked; } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&UI.modal){ UI.modal=null; render(); } });
function refreshNeeds(){ /* fields keep values in UI.form; buttons validate on click */ }

// initial: honor ?role= & ?dev=
const P=new URLSearchParams(location.search);
if(['admin','leader','member'].includes(P.get('role'))) UI.role=P.get('role');
UI.dev=P.get('dev')==='mobile'||(!P.get('dev')&&window.innerWidth<700)?'mobile':'web';
render();
})();
</script>
