<title>Settlor Servicing Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Playfair+Display:wght@900&family=Roboto+Slab:wght@600;700&family=Roboto+Mono:wght@400;500&family=Dancing+Script:wght@600&display=swap">
<style>
/* Layout: ILIA servicing-portal shell (left nav · main) + a decisions rail for what the settlor can do per screen */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f6f8fb; --line:#dde2ea; --line-strong:#c4ccd8;
  --ink:#1b2230; --muted:#5d6878; --faint:#8a94a4;
  --accent:#2c66e6; --accent-ink:#ffffff; --accent-soft:#e8effd;
  --hero1:#16345f; --hero2:#2b7be6;
  --ok:#11845b; --ok-soft:#e3f3ec; --warn:#b06a07; --warn-soft:#fcf1df; --bad:#c22f3c; --bad-soft:#fbe7e9;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.06);
  --ff:'Roboto',-apple-system,'Segoe UI',Arial,sans-serif; --fd:'Roboto Slab',Georgia,serif; --fm:'Roboto Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#161d28; --surface-2:#121923; --line:#28323f; --line-strong:#3a4656;
  --ink:#e6ebf2; --muted:#9ba7b7; --faint:#6e7a8a;
  --accent:#6b97f5; --accent-ink:#0b1220; --accent-soft:#18253d; --hero1:#0f2546; --hero2:#1f5fbf;
  --ok:#3cc68f; --ok-soft:#12291f; --warn:#e2a443; --warn-soft:#2b2211; --bad:#ef6b76; --bad-soft:#2d1619;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --surface-2:#121923; --line:#28323f; --line-strong:#3a4656;
  --ink:#e6ebf2; --muted:#9ba7b7; --faint:#6e7a8a;
  --accent:#6b97f5; --accent-ink:#0b1220; --accent-soft:#18253d; --hero1:#0f2546; --hero2:#1f5fbf;
  --ok:#3cc68f; --ok-soft:#12291f; --warn:#e2a443; --warn-soft:#2b2211; --bad:#ef6b76; --bad-soft:#2d1619;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mockbar{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.reset{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px}
.mocklabel{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:12.5px}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.mocktag{margin-left:auto;font-size:11.5px;color:var(--muted)}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 56px)}
/* Questions removed from the mock view (11/2): answers are applied and logged in the W-SETTLOR decisions file. */
.rail,.oq,.dtab{display:none!important}
@media (max-width:1240px){.shell{grid-template-columns:230px minmax(0,1fr)}}
@media (max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}.nav{border-right:0;border-bottom:1px solid var(--line)}}

/* Left nav */
.nav{background:var(--surface);border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:baseline;gap:6px;padding:0 10px 4px}
.hero-tx{flex:1 1 320px;min-width:0}
.logo b{font-size:30px;letter-spacing:-.02em}
.logo span{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--faint)}
.hero .who{position:relative;z-index:1;flex:0 0 auto;width:260px;padding:12px 14px;border:1px solid rgba(255,255,255,.28);border-radius:10px;background:rgba(255,255,255,.12);color:#fff}
.who b{display:block;font-size:14px}
.who small{display:block;font-size:12px;color:rgba(255,255,255,.85)}
.hero .rb{background:#fff;color:#1d6b46}
.hero .rb.s{background:#fff;color:#1b4fa8}
.rb{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;border-radius:20px;padding:2px 8px;background:var(--ok-soft);color:var(--ok)}
.rb.s{background:var(--accent-soft);color:var(--accent)}
.navsec{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 12px 4px}
.nav button.ni{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 12px;border-radius:8px;font-size:13.5px}
.nav button.ni:hover{background:var(--surface-2)}
.nav button.ni[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav button.ni[disabled]{color:var(--faint);cursor:not-allowed}
.tag{font-size:10px;font-weight:700;border-radius:20px;padding:1px 7px;white-space:nowrap}
.t-view{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.t-act{background:var(--ok-soft);color:var(--ok)}
.t-no{background:var(--bad-soft);color:var(--bad)}
.t-ask{background:var(--warn-soft);color:var(--warn)}
.t-cnt{background:var(--bad);color:#fff}
.polctx{margin:6px 6px 2px;padding:10px 12px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);font-size:12.5px}
.polctx b{display:block;font-size:13px;color:var(--ink)}
.polctx button{border:0;background:none;color:var(--accent);padding:4px 0 0;font-size:12px;font-weight:500}

/* Main */
.main{padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:18px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border-radius:12px;padding:26px 28px;color:#fff;background:linear-gradient(110deg,var(--hero1),var(--hero2));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:420px;height:260px;background:rgba(255,255,255,.08);transform:rotate(-18deg);border-radius:40px}
.hero .bar{width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,#e94b6a,#f2b33d,#3cc68f,#5aa0ff);margin-bottom:14px}
.hero h1{font-family:var(--fd);font-size:28px;margin:0 0 8px;letter-spacing:-.01em;position:relative}
.hero p{margin:0;max-width:70ch;font-size:15px;line-height:1.55;color:rgba(255,255,255,.92);position:relative}
.sumrow{display:flex;flex-wrap:wrap;gap:10px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:8px;align-items:center}
.sum b{font-size:18px}
.h2{font-size:16px;font-weight:700;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--ink)}
.pcard:hover:not([disabled]){border-color:var(--accent)}
.pcard[disabled]{opacity:.75;cursor:not-allowed}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pcard .nm{font-size:16px;font-weight:700}
.pcard.own{border:2px solid var(--accent);position:relative}
.ownb{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 10px}
.pcard .sub{font-size:12.5px;color:var(--muted)}
.pcard .meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-soft)} .p-warn{color:var(--warn);background:var(--warn-soft)} .p-neu{color:var(--muted);background:var(--surface-2);border:1px solid var(--line)} .p-bad{color:var(--bad);background:var(--bad-soft)}
.pcard .go{align-self:flex-start;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px}
.sig{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sig:last-child{border-bottom:0}
.sig b{font-size:14px}
.sig small{display:block;color:var(--muted);font-size:12.5px}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 13px;font-size:13px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.note{font-size:12.5px;color:var(--muted)}
.ctxline{font-size:13.5px}
.ilx{font-family:Roboto,Arial,sans-serif;color:#424242;display:flex;flex-direction:column;gap:0;background:#fff;border-radius:8px;padding:24px}
.ilx p{margin:0 0 1.3rem}
.ilx .ih2{font-family:'Playfair Display',serif;font-weight:900;font-size:42px;line-height:1.3;color:#424242;margin:0 0 8px}
.ilx .ih3{font-family:'Playfair Display',serif;font-weight:900;font-size:34px;line-height:1.3;color:#424242;margin:30px 0 8px}
.ilx .ih4{font-size:34px;line-height:39px;margin:4px 0 10px;font-weight:400}
.ilx .ih5{font-size:22px;line-height:33px;margin:0 0 10px;font-weight:400}
.ilx .sub1,.ilx .s1{font-size:20px;line-height:30px}
.ilx .b1{font-size:18px;line-height:27px}.ilx .b2{font-size:16px;line-height:24px}
.ilx .cap{font-size:16px;line-height:24px;letter-spacing:.4px;margin-bottom:6px}
.ilx .blue{color:#3671ED;margin-bottom:2px}.ilx .g{color:#3cda93}
.ilx hr{border:0;border-top:1px solid #e0e0e0;margin:20px 0}
.ilx-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ilx-ht{flex:1 1 380px;min-width:0}
.ilx-who{flex:0 0 auto;width:240px;padding:10px 12px;border:1px solid #D8D8D8;border-radius:8px;background:#fafafa;font-size:13px}
.ilx-who b{display:block;font-size:14px}.ilx-who small{display:block;color:#666;font-size:12px}
.ilx-who.dark{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}.ilx-who.dark small{color:rgba(255,255,255,.85)}
.ilx-hero{position:relative;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;min-height:300px;border-radius:8px;padding:15px 15px 15px 40px;margin-bottom:30px;color:#fff;background:linear-gradient(90deg,#14395E 0%,#1B6DB2 35%,#2691EC 100%)}
.ilx-hero-l{flex:1 1 360px;max-width:640px}
.ilx-hero h2{font-family:'Playfair Display',serif;font-weight:900;font-size:36px;color:#fff;margin:0 0 12px}
.ilx-hero p{font-size:20px;line-height:30px;color:#fff}
.ilx-bar{width:73px;height:4px;border-radius:4px;margin-bottom:14px;background:linear-gradient(90deg,#1E88E5,#3DDB93 32%,#F50057 69%,#FFB05F)}
.ilx-sel{margin:10px 0 16px;max-width:420px}.ilx-sel .b1{margin-bottom:8px}
.ilx-out{position:relative;display:block;border:1px solid #c4c4c4;border-radius:4px;padding:0 12px;min-width:200px}
.ilx-out>span{position:absolute;top:-9px;left:8px;background:#fff;padding:0 4px;font-size:12px;color:#666}
.ilx-out select,.ilx-out input{width:100%;border:0;background:transparent;font:inherit;font-size:16px;padding:14px 0;outline:0}
.ilx-out i{position:absolute;right:12px;top:14px;font-style:normal}
.ilx-sum{display:flex;flex-wrap:wrap;gap:16px;margin:10px 0 24px}
.ilx-paycard,.ilx-scard{width:300px;min-height:170px;border-radius:8px;box-shadow:0 0 16px rgba(0,0,0,.18);padding:16px;box-sizing:border-box}
.ilx-paycard{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:linear-gradient(330.33deg,#3DDB93 0%,#1E88E5 100%)}
.ilx-paycard .cap{color:#fff}
.ilx-scard{display:flex;align-items:center;gap:14px;background:#fff}.ilx-scard p{margin:0}.ilx-sic{font-size:36px}
.ibtn{border-radius:50px;padding:10px 50px;font-size:16px;font-family:Roboto,sans-serif;background:#3671ED;color:#fff;border:0;cursor:pointer;box-shadow:none}
.ibtn.sm{padding:6px 25px}.ibtn.wht{background:#fff;color:#000}
.ilx-paycard .ibtn{background:#fff;color:#3671ED}
.ilx-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;margin-bottom:24px}
.ilx-tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-height:260px;border:0;border-radius:8px;box-shadow:0 0 16px rgba(0,0,0,.18);background:#fff;padding:20px;color:#424242;cursor:pointer;font-family:Roboto,sans-serif}
.ilx-tile .s1{font-size:20px}.ilx-timg{display:flex;align-items:center;justify-content:center;width:100%;height:110px;border-radius:6px;background:#EDF3F8;font-size:44px}
.ilx-disc{font-size:16px}
.icard{background:#fff;border-radius:8px;box-shadow:0 0 16px rgba(0,0,0,.18);padding:24px}.icard.p30{padding:30px}
.ilx-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.ilx-2.w57{grid-template-columns:5fr 7fr}
.ilx-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.ilx-2,.ilx-2.w57,.ilx-3{grid-template-columns:1fr}.ilx .ih2{font-size:30px}}
.ilx-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.ilx-row .ilx-out{flex:1 1 200px}
.h5g{font-size:22px;color:#3cda93}.h5d{font-size:22px}
.ilx-tabs{display:flex;background:#f5f5f5;box-shadow:0 2px 4px rgba(0,0,0,.12);margin:12px 0}
.ilx-tabs button{flex:1;border:0;background:none;padding:12px 8px;font:500 14px Roboto,sans-serif;text-transform:uppercase;letter-spacing:.4px;color:rgba(0,0,0,.6);border-bottom:2px solid transparent;cursor:pointer}
.ilx-tabs button[aria-selected="true"]{color:#3671ED;border-bottom-color:#3671ED}
.ilx-tw{overflow-x:auto}
.ilx-t{width:100%;border-collapse:collapse;font-size:16px}
.ilx-t th{background:#EDF3F8;font-weight:400;font-size:18px;text-align:left;padding:16px 15px}
.ilx-t td{padding:8px 15px;border-bottom:1px solid #e0e0e0}
.ilx-ic{color:#3671ED}
.ilx-search{display:flex;justify-content:flex-end;margin:10px 0}.ilx-search .ilx-out{width:42%;min-width:220px}
.ilx-blue{color:#fff;border-radius:8px;padding:24px;background:linear-gradient(131.65deg,#12253D 0%,#2196F3 100%);box-shadow:0 8px 30px rgba(0,0,0,.16)}
.ilx-blue .cap,.ilx-blue p{color:#fff}
.ilx-arrow{display:flex;justify-content:space-between;gap:12px;padding:6px 8px;font-size:16px}
.ilx-arrow.hl{background:rgba(255,215,0,.15);border-top:2px solid #3cda93;font-weight:700}
.ilx-arw{max-width:66%;margin-bottom:16px}@media (max-width:900px){.ilx-arw{max-width:none}}
.ilx-call{border-left:3px solid #22C55E;background:rgba(34,197,94,.03);border-radius:0 4px 4px 0;padding:10px 12px;margin-bottom:12px}.ilx-call p{margin:0}
.ilx-ltv{display:flex;justify-content:space-between;border:1px solid #22C55E;border-radius:4px;padding:10px 12px;margin-bottom:8px}
.ilx-tbtn{float:right;border:0;background:none;color:#3671ED;font:500 14px Roboto,sans-serif;cursor:pointer;padding:6px 8px}
.ilx-sec{overflow:hidden}
.ilx-w8{max-width:880px}.ilx-w9{max-width:980px}
.ilx-g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:18px}@media (max-width:700px){.ilx-g3{grid-template-columns:1fr}}
.ilx-dis{position:relative;display:block;border:1px solid #c4c4c4;border-radius:4px;background:#d4d4d4}
.ilx-dis span{position:absolute;top:-9px;left:8px;padding:0 4px;font-size:12px;color:#666;background:linear-gradient(#fff 50%,#d4d4d4 50%)}
.ilx-dis input{width:100%;border:0;background:transparent;font:inherit;font-size:16px;padding:14px 12px;color:rgba(0,0,0,.38)}
.ilx-acc{border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.2);padding:0 16px}.ilx-acc summary{padding:14px 0;font-size:16px;cursor:pointer}
.ilx-cl{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:center}@media (max-width:700px){.ilx-cl{grid-template-columns:1fr}}
.ilx-dec{font-size:13.5px;line-height:1.45;color:#5b4a00;background:#fff8e1;border:1px dashed #e0b84a;border-radius:6px;padding:8px 10px;margin:8px 0 16px!important}
.ilx-tbd{display:inline-flex;align-items:center;gap:6px;float:right}.ilx-tbd .ibtn[disabled],.ilx-tbd .ilx-tbtn[disabled]{opacity:.5;cursor:not-allowed}
.ilx-cl .ilx-tbd{float:none;flex-direction:column}
.ilx-alert{display:flex;flex-direction:column;gap:2px;border:1px solid #ff9800;color:#663c00;border-radius:4px;padding:10px 14px;margin:6px 0 14px;font-size:14px;background:#fff}
.ilx-alert b{font-size:16px}
.ilx-chip{display:inline-block;font-size:12px;border-radius:16px;padding:1px 8px;background:#e0e0e0;color:#424242;margin-left:4px}
.wf-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.wf-dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;width:min(640px,calc(100% - 32px));max-height:calc(100% - 40px);display:flex;flex-direction:column;background:#fff;border-radius:8px;box-shadow:0 11px 15px -7px rgba(0,0,0,.2),0 24px 38px 3px rgba(0,0,0,.14);font-family:Roboto,Arial,sans-serif;color:#424242}
.wf-hd{display:flex;justify-content:space-between;align-items:center;padding:16px 24px 8px}.wf-hd h3{margin:0;font-size:22px;font-weight:500}
.wf-x{border:0;background:none;font-size:18px;cursor:pointer;color:#666}
.wf-prop{margin:0 24px 6px;font-size:13px;color:#8a5a00;background:#fff8e1;border:1px dashed #e0b84a;border-radius:6px;padding:6px 10px}
.wf-steps{display:flex;gap:6px;list-style:none;margin:4px 24px 0;padding:0 0 10px;border-bottom:1px solid #e0e0e0;font-size:12.5px;flex-wrap:wrap}
.wf-steps li{padding:3px 10px;border-radius:14px;background:#f2f2f2;color:#777}.wf-steps li.c{background:#3671ED;color:#fff}.wf-steps li.d{background:#e3f6ec;color:#1d7a4d}
.wf-bd{padding:16px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;font-size:15px}
.wf-bd p{margin:0}
.wf-ft{display:flex;justify-content:flex-end;gap:10px;padding:12px 24px 18px;border-top:1px solid #e0e0e0}
.wf-ft .ibtn{padding:8px 32px}.wf-ft .ibtn[disabled]{opacity:.45;cursor:not-allowed}.wf-back{background:#fff!important;color:#3671ED!important;border:1px solid #3671ED!important}
.wf-l{font-weight:500;margin-bottom:6px!important}
.wf-opts{display:flex;flex-wrap:wrap;gap:8px}
.wf-opt{border:1px solid #c4c4c4;border-radius:50px;background:#fff;padding:7px 16px;font:15px Roboto,sans-serif;cursor:pointer;color:#424242}

.acct-menu{position:absolute;right:0;top:42px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:170px;z-index:20;padding:6px}
.acct-menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 12px;border-radius:6px;font-size:13.5px}
.acct-menu button:hover{background:var(--surface-2)}
.pwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.f2{display:flex;flex-direction:column;gap:3px}
.f2 label{font-size:12px;color:var(--muted)}
.pwf{text-align:left;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:6px;padding:9px 11px;font-size:14px;letter-spacing:.12em}
.pwf.txt{letter-spacing:0;font-size:14px;cursor:pointer}
.pwf.txt.on{border-color:var(--accent);background:var(--accent-soft)}
.chg{font-size:10.5px;font-weight:700;color:var(--accent);margin-left:4px}
.pendnote{margin:10px 0 0;padding:8px 10px;border-radius:6px;background:var(--accent-soft)}
.pwf.empty{color:var(--faint);letter-spacing:0;font-size:13px}
.rules{list-style:none;margin:10px 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.rules li{display:flex;align-items:center;gap:6px}
.rules li.ok{color:var(--ok)}
.rules i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-style:normal;font-size:10px}
.rules li.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.loggedout{min-height:60vh;display:grid;place-items:center}
.lo-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px 32px;text-align:center;max-width:380px}
.lo-card .logo{justify-content:center}
.lo-card h2{margin:6px 0 6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;z-index:30}

function advance(pid,sid){var r=findSign(pid,sid),it=r.it,last=ROUTES[it.type].length-1; if(it.step<last){it.step++;} render(); toast(ROUTES[it.type][it.step]+(it.step===last?' ✓ complete':''));}
function doneList(items){

document.getElementById("signRoot").addEventListener("click",function(ev){
  var t=ev.target.closest("[data-sg]"); if(!t||!sg) return; var a=t.dataset.sg;
  if(a==="close"){ var wasDone=sg.done; closeSign(); if(wasDone){ render(); toast("Signed. It’s now with the trustee."); } return; }
  if(a==="opt"){ sg.f.opt=t.dataset.v; }
  if(a==="chk"){ sg.f.chk=!sg.f.chk; }
  if(a==="tab"){ if(!sg.adopted){ sg.adoptFor={k:t.dataset.k}; } else { sg.f[t.dataset.k]=true; } }
  if(a==="adopt"){ sg.adopted=true; window.__adopted=true; if(sg.adoptFor) sg.f[sg.adoptFor.k]=true; sg.adoptFor=null; }
  if(a==="noadopt"){ sg.adoptFor=null; }
  if(a==="finish"){ var r=findSign(sg.pid,sg.sid); r.it.status="signed"; r.it.step=1; r.it.signedOn="Oct 28, 2026";
    if(sg.type==="dbr"){ r.it.choiceLabel={full:"Full reduction",half:"Half reduction",none:"No reduction"}[sg.f.opt]; }

});

/* ---------- Decisions rail: answer, note, save & lock ---------- */
/* Storage: the Claude Artifact page saves to its shared database (Claude can read it back to log it).
   Anywhere else (e.g. GitHub Pages) it saves in this browser only. */
var DOC_PATH="portal/decisions", store=null, storeMode="local", saving=false;
/* Team answer sheet (Google Apps Script web app). Personal links carry ?u=<user>&k=<key>; keys are checked by the script. */
var TEAM_URL="";
var QS=new URLSearchParams(location.search), TU=QS.get("u"), TK=QS.get("k"), teamName="", teamErr="";
function teamOn(){ return !!(TEAM_URL && TU && TK); }
function localKey(){ return teamOn() ? "settlorPortalDecisions:"+TU : "settlorPortalDecisions"; }
function teamSave(r){
  try{ localStorage.setItem(localKey(),JSON.stringify(r)); }catch(e){}
  return fetch(TEAM_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({u:TU,k:TK,record:r})})
    .then(function(x){return x.json();}).then(function(j){ if(!j.ok) throw new Error(j.error||"save failed"); teamErr=""; return j; });
}
function nowLabel(){var d=new Date();return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})+" "+d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});}
function applyRecord(r){ if(!r) return; if(r.choices) Object.keys(r.choices).forEach(function(k){if(k in choice) choice[k]=r.choices[k];});
  if(r.notes) Object.keys(r.notes).forEach(function(k){if(k in notes) notes[k]=r.notes[k];}); rowLock={}; if(r.rowLocks) Object.keys(r.rowLocks).forEach(function(k){rowLock[k]=!!r.rowLocks[k];}); saved.locked=!!r.locked; saved.savedAt=r.savedAt||null; }
function record(lock){return {choices:Object.assign({},choice), notes:Object.assign({},notes), rowLocks:Object.assign({},rowLock), locked:lock, savedAt:nowLabel(), updatedAt:new Date().toISOString(),
  answers:DECISIONS.reduce(function(a,g){g.items.forEach(function(d){a.push({key:d.k,question:d.q,answer:choice[d.k],suggested:d.rec,note:notes[d.k]||"",locked:lock||!!rowLock[d.k]});});return a;},[])};}
function persist(lock,msg){
  var r=record(lock);
  if(teamOn() && storeMode==="team"){ saving=true; renderRail(); return teamSave(r).then(function(){saving=false;applyRecord(r);render();toast(msg||(lock?"Answers saved and locked":"Unlocked for editing"));},function(){saving=false;teamErr="Couldn’t reach the team sheet. Saved in this browser for now.";applyRecord(r);render();toast("Saved in this browser only. Try again in a moment.");}); }
  if(store){ saving=true; renderRail(); return store.doc(DOC_PATH).set(r).then(function(){saving=false;applyRecord(r);render();toast(msg||(lock?"Answers saved and locked":"Unlocked for editing"));},function(){saving=false;renderRail();toast("Couldn’t save. Try again.");}); }
  try{ localStorage.setItem("settlorPortalDecisions",JSON.stringify(r)); }catch(e){}
  applyRecord(r); render(); toast(msg||(lock?"Saved and locked (this browser only)":"Unlocked for editing"));
}
(function initStore(){
  if(teamOn()){
    var local=null; try{ local=JSON.parse(localStorage.getItem(localKey())||(TU==="jamin"?localStorage.getItem("settlorPortalDecisions"):null)||"null"); }catch(e){}
    if(local) applyRecord(local);
    storeMode="team"; render();
    fetch(TEAM_URL+"?u="+encodeURIComponent(TU)+"&k="+encodeURIComponent(TK)).then(function(x){return x.json();}).then(function(j){
      if(!j.ok){ storeMode="local"; teamErr="This answer link isn’t valid. Ask Jamin for your link."; render(); return; }
      teamName=j.name||"";
      if(j.record){ applyRecord(j.record); render(); }
      else if(local && local.savedAt){ teamSave(local).then(function(){render();toast("Your earlier answers were added to the team sheet");},function(){render();}); }
      else render();
    },function(){ teamErr="Couldn’t reach the team sheet. Answers save in this browser for now."; render(); });
    return;
  }
  try{ var raw=localStorage.getItem("settlorPortalDecisions"); if(raw){applyRecord(JSON.parse(raw)); render();} }catch(e){}
  if(window.claude && window.claude.use){
    window.claude.use("db").then(function(db){
      if(!db) return; store=db; storeMode="shared";
      db.doc(DOC_PATH).onSnapshot(function(s){ var ae=document.activeElement; if(ae && ae.classList && ae.classList.contains('note-in')) return; if(s.exists && !saving){ applyRecord(s.data()); render(); } else renderRail(); }, function(){ store=null; storeMode="local"; renderRail(); });
    }, function(){});
  }
})();
function renderRail(){
  var cur=view, L=saved.locked, n=0, total=0, nl=0; DECISIONS.forEach(function(g){g.items.forEach(function(d){total++; if(rowLock[d.k]) nl++;});});
  var status = L ? '<div class="status locked">🔒 Locked · saved '+esc(saved.savedAt)+'</div>' : '<div class="status draft">'+(saved.savedAt?'Editing · '+nl+' of '+total+' questions locked · last saved '+esc(saved.savedAt):'Draft · not saved yet')+'</div>';
  var where = teamErr ? '<span class="bad">'+esc(teamErr)+'</span>' : storeMode==="team" ? 'Answering as <b>'+esc(teamName||TU)+'</b>. Your answers save to the team answer sheet, and Jamin sees them there.' : storeMode==="shared" ? 'Saved to this page’s shared record. Claude can read it back to log it.' : 'Saving in <b>this browser only</b>.';
  var h='<h4>What can the authorized signer do?</h4>'+
    '<p class="intro">The <b>authorized signer</b> is the one person who logs in here: the settlor themself, or the person who signs for an entity settlor. My suggestion is pre-selected. Ask each question, pick the answer, add a note, then <b>Save &amp; lock</b>.</p>'+
    status+'<div class="copyrow">'+(L?'<button class="btn sm" data-act="unlock">Unlock to edit</button>':'<button class="btn sm primary" data-act="save"'+(saving?' disabled':'')+'>'+(saving?'Saving…':'Save &amp; lock answers')+'</button><button class="btn sm" data-act="resetdec">Reset to suggestions</button>')+'<button class="btn sm" data-act="copy">Copy answers</button></div>'+
    '<p class="where">'+where+'</p>';
  DECISIONS.forEach(function(g){
    h+='<div class="dgrp"><h5>'+g.g+'</h5>'+g.items.map(function(d){ n++;
      var changed=choice[d.k]!==d.rec, RL=L||!!rowLock[d.k];
      return '<div class="drow'+(d.screen===cur?' cur':'')+(RL?' locked':'')+'"><div class="q"><span class="qn">'+n+'</span>'+esc(d.q)+'</div>'+
        '<div class="opts">'+OPTS.map(function(o){return '<button data-dk="'+d.k+'" data-dv="'+o+'" aria-pressed="'+(choice[d.k]===o)+'"'+(RL?' disabled':'')+'>'+o+'</button>';}).join("")+'<button class="lockbtn'+(RL?' on':'')+'" data-lk="'+d.k+'" aria-pressed="'+RL+'" title="'+(L?'Everything is locked. Use Unlock to edit.':RL?'Unlock this question':'Lock this question')+'" aria-label="'+(RL?'Unlock':'Lock')+' question '+n+'"'+(L?' disabled':'')+'>'+(RL?'\ud83d\udd12':'\ud83d\udd13')+'</button></div>'+
        '<div class="why"><b>Suggested:</b> '+esc(d.rec)+(changed?' · <span class="chg">changed</span>':'')+(d.why?' — '+esc(d.why):'')+'</div>'+
        (RL ? (notes[d.k]?'<div class="notev">📝 '+esc(notes[d.k])+'</div>':'')
           : '<textarea class="note-in" id="note-'+d.k+'" data-nk="'+d.k+'" rows="1" placeholder="Note from the call (saves automatically)">'+esc(notes[d.k])+'</textarea><div class="nsaved" id="ns-'+d.k+'">'+(notes[d.k]?'Saved \u2713':'')+'</div>')+
      '</div>';
    }).join("")+'</div>';
  });
  document.getElementById("rail").innerHTML=h;
}
function decisionsText(){
  var out=["Settlor Servicing Portal — what the authorized signer can do",(saved.locked?"Locked · saved "+saved.savedAt:"Draft (not saved)"),""], n=0;
  DECISIONS.forEach(function(g){out.push(g.g.toUpperCase());g.items.forEach(function(d){n++;out.push(n+". "+d.q);out.push("   Answer: "+choice[d.k]+(choice[d.k]!==d.rec?"  (suggested: "+d.rec+")":""));if(notes[d.k])out.push("   Note: "+notes[d.k]);});out.push("");});
  return out.join("\n");
}
var noteTimers={};
function markNote(k,txt,bad){var el=document.getElementById('ns-'+k); if(el){el.textContent=txt; el.className='nsaved'+(bad?' bad':'');}}
function saveNoteQuiet(k){
  var r=record(saved.locked); var t=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  if(teamOn() && storeMode==="team"){ saving=true; teamSave(r).then(function(){saving=false; saved.savedAt=r.savedAt; markNote(k,'Saved \u2713 '+t);}, function(){saving=false; markNote(k,'Saved in this browser only. The team sheet didn’t answer.',true);}); return; }
  if(store){ saving=true; store.doc(DOC_PATH).set(r).then(function(){saving=false; saved.savedAt=r.savedAt; markNote(k,'Saved \u2713 '+t);}, function(){saving=false; markNote(k,'Not saved. Check your connection and type again.',true);}); return; }
  try{ localStorage.setItem('settlorPortalDecisions',JSON.stringify(r)); saved.savedAt=r.savedAt; markNote(k,'Saved \u2713 '+t+' (this browser)'); }catch(e){ markNote(k,'Not saved in this browser.',true); }
}
document.addEventListener("input",function(ev){ var t=ev.target; if(t.dataset && t.dataset.nk){ var k=t.dataset.nk; notes[k]=t.value; markNote(k,'Saving\u2026'); clearTimeout(noteTimers[k]); noteTimers[k]=setTimeout(function(){saveNoteQuiet(k);},1200); } });

/* ---------- Events ---------- */
document.addEventListener("click",function(ev){
  if(acctOpen && !ev.target.closest(".acct")){ acctOpen=false; render(); }
  var t=ev.target.closest("[data-nav],[data-pick],[data-act],[data-dk],[data-w],[data-tab],[data-lk]"); if(!t) return;
  if(t.dataset.lk){ if(saved.locked) return; var k=t.dataset.lk; rowLock[k]=!rowLock[k]; var keep=document.getElementById("rail").scrollTop; persist(false, rowLock[k]?"Question locked and saved":"Question unlocked"); setTimeout(function(){document.getElementById("rail").scrollTop=keep;},0); return; }
  if(t.dataset.tab){ tabState[t.dataset.tab]=+t.dataset.ti; render(); return; }
  if(t.dataset.w){ who=t.dataset.w; prof=null; emailPending=""; [].forEach.call(document.querySelectorAll("#who button"),function(b){b.setAttribute("aria-pressed",b===t?"true":"false");});
    pol=null; view="home"; render(); return; }
  if(t.dataset.nav){ var v=t.dataset.nav; if(v==="home"){pol=null;} view=v; render(); window.scrollTo(0,0); return; }
  if(t.dataset.pick){ pol=P().policies.filter(function(x){return x.id===t.dataset.pick;})[0]; view="dash"; render(); window.scrollTo(0,0); return; }
  if(t.dataset.dk){ choice[t.dataset.dk]=t.dataset.dv; var keep=document.getElementById("rail").scrollTop; render(); document.getElementById("rail").scrollTop=keep; return; }
  var a=t.dataset.act;
  if(a==="signdoc"){ openSign(t.dataset.pid,t.dataset.sid); return; }
  if(a==="viewcopy"){ toast("Mock: opens the signed PDF"); }
  if(a==="adv"){ advance(t.dataset.pid,t.dataset.sid); return; }
  if(a==="mock") toast("Mock: opens an edit form");
  if(a==="profedit"){ var pp=P(); prof={}; PROF_FIELDS.forEach(function(f){prof[f[0]]=profVal(pp,f[0]);}); render(); return; }
  if(a==="proffill"){ var k=t.dataset.k, cur=profVal(P(),k); prof[k]= prof[k]===cur ? PROF_SAMPLE[who][k] : cur; render(); return; }
  if(a==="profcancel"){ prof=null; render(); return; }
  if(a==="profsave"){ var q=P(), em=prof.email!==q.email, any=PROF_FIELDS.some(function(f){return prof[f[0]]!==profVal(q,f[0]);});
    ["first","last","phone","addr"].forEach(function(k){q[k]=prof[k];});
    if(em) emailPending=prof.email; prof=null; render(); renderNav&&renderNav();
    if(!any){toast("No changes to save");return;}
    acctProc(em?[["You","Save the change. A confirmation link goes to the new email. Log in and forms stay on the old email until it’s confirmed.",[["New email","Confirm your new ILIA email"],["Current email","Someone asked to change your ILIA email"]]],["You","Click the link in the new email. The new email becomes your login, and forms go there.",[["New email","Your ILIA email was changed"]]],["NIW","Sees the new email on the Case Details screen.",[]],["Open","",[],"Does a self-changed email also need NIW approval?"]]
      :[["You","Save the change. It shows right away.",[["Your email","Your ILIA details were updated"]]],["NIW","Sees the new details on the Case Details screen.",[]]],"Details saved"); return; }
  if(a==="signAll"){ pol=null; view="sign"; render(); return; }
  if(a==="acct"){ acctOpen=!acctOpen; render(); return; }
  if(a==="myacct"){ acctOpen=false; pol=null; view="profile"; render(); window.scrollTo(0,0); return; }
  if(a==="logout"){ acctOpen=false; pol=null; view="loggedout"; render(); return; }
  if(a==="relogin"){ view="home"; render(); return; }
  if(a==="pwfill"){ var smp={cur:"OldPass#2025",nw:"Settlor#2026",cf:"Settlor#2026"}; pw[t.dataset.k]=smp[t.dataset.k]; render(); return; }
  if(a==="pwsave"){ pw={cur:"",nw:"",cf:""}; render(); acctProc([["You","Update the password. You stay logged in on this device.",[["Your email","Your ILIA password was changed (if this wasn’t you, contact us)"]]]],"Password updated"); return; }
  if(a==="save"){ persist(true); }
  if(a==="unlock"){ persist(false); }
  if(a==="resetdec"&&!saved.locked){ DECISIONS.forEach(function(g){g.items.forEach(function(d){if(!rowLock[d.k]) choice[d.k]=d.rec;});}); render(); toast("Unlocked questions reset to suggestions"); }
  if(a==="copy"){ var txt=decisionsText();
    try{ navigator.clipboard.writeText(txt).then(function(){toast("Decisions copied");},function(){toast("Copy blocked. Select the text in the panel instead.");}); }catch(e){ toast("Copy blocked."); } }
});
render();
</script>
