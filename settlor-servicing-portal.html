<title>Settlor Servicing Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: ILIA servicing-portal shell (left nav · main) + a decisions rail for what the settlor can do per screen */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f6f8fb; --line:#dde2ea; --line-strong:#c4ccd8;
  --ink:#1b2230; --muted:#5d6878; --faint:#8a94a4;
  --accent:#2c66e6; --accent-ink:#ffffff; --accent-soft:#e8effd;
  --hero1:#16345f; --hero2:#2b7be6;
  --ok:#11845b; --ok-soft:#e3f3ec; --warn:#b06a07; --warn-soft:#fcf1df; --bad:#c22f3c; --bad-soft:#fbe7e9;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.06);
  --ff:'Roboto',-apple-system,'Segoe UI',Arial,sans-serif; --fd:'Roboto Slab',Georgia,serif; --fm:'Roboto Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#161d28; --surface-2:#121923; --line:#28323f; --line-strong:#3a4656;
  --ink:#e6ebf2; --muted:#9ba7b7; --faint:#6e7a8a;
  --accent:#6b97f5; --accent-ink:#0b1220; --accent-soft:#18253d; --hero1:#0f2546; --hero2:#1f5fbf;
  --ok:#3cc68f; --ok-soft:#12291f; --warn:#e2a443; --warn-soft:#2b2211; --bad:#ef6b76; --bad-soft:#2d1619;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --surface-2:#121923; --line:#28323f; --line-strong:#3a4656;
  --ink:#e6ebf2; --muted:#9ba7b7; --faint:#6e7a8a;
  --accent:#6b97f5; --accent-ink:#0b1220; --accent-soft:#18253d; --hero1:#0f2546; --hero2:#1f5fbf;
  --ok:#3cc68f; --ok-soft:#12291f; --warn:#e2a443; --warn-soft:#2b2211; --bad:#ef6b76; --bad-soft:#2d1619;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mockbar{background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.reset{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px}
.mocklabel{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:12.5px}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.mocktag{margin-left:auto;font-size:11.5px;color:var(--muted)}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr) 340px;min-height:calc(100vh - 56px)}
@media (max-width:1240px){.shell{grid-template-columns:230px minmax(0,1fr)}.rail{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}.nav{border-right:0;border-bottom:1px solid var(--line)}}

/* Left nav */
.nav{background:var(--surface);border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:baseline;gap:6px;padding:0 10px 14px}
.logo b{font-size:30px;letter-spacing:-.02em}
.logo span{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--faint)}
.who{margin:0 6px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.who b{display:block;font-size:13.5px}
.who small{display:block;font-size:11.5px;color:var(--muted)}
.rb{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:700;letter-spacing:.03em;border-radius:20px;padding:2px 8px;background:var(--ok-soft);color:var(--ok)}
.rb.s{background:var(--accent-soft);color:var(--accent)}
.navsec{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:12px 12px 4px}
.nav button.ni{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:9px 12px;border-radius:8px;font-size:13.5px}
.nav button.ni:hover{background:var(--surface-2)}
.nav button.ni[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav button.ni[disabled]{color:var(--faint);cursor:not-allowed}
.tag{font-size:10px;font-weight:700;border-radius:20px;padding:1px 7px;white-space:nowrap}
.t-view{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.t-act{background:var(--ok-soft);color:var(--ok)}
.t-no{background:var(--bad-soft);color:var(--bad)}
.t-ask{background:var(--warn-soft);color:var(--warn)}
.t-cnt{background:var(--bad);color:#fff}
.polctx{margin:6px 6px 2px;padding:10px 12px;border-radius:10px;border:1px solid var(--accent);background:var(--accent-soft);font-size:12.5px}
.polctx b{display:block;font-size:13px;color:var(--ink)}
.polctx button{border:0;background:none;color:var(--accent);padding:4px 0 0;font-size:12px;font-weight:500}

/* Main */
.main{padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:18px}
.hero{border-radius:12px;padding:26px 28px;color:#fff;background:linear-gradient(110deg,var(--hero1),var(--hero2));position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:420px;height:260px;background:rgba(255,255,255,.08);transform:rotate(-18deg);border-radius:40px}
.hero .bar{width:64px;height:4px;border-radius:4px;background:linear-gradient(90deg,#e94b6a,#f2b33d,#3cc68f,#5aa0ff);margin-bottom:14px}
.hero h1{font-family:var(--fd);font-size:28px;margin:0 0 8px;letter-spacing:-.01em;position:relative}
.hero p{margin:0;max-width:70ch;font-size:15px;line-height:1.55;color:rgba(255,255,255,.92);position:relative}
.sumrow{display:flex;flex-wrap:wrap;gap:10px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;display:flex;gap:8px;align-items:center}
.sum b{font-size:18px}
.h2{font-size:16px;font-weight:700;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--ink)}
.pcard:hover:not([disabled]){border-color:var(--accent)}
.pcard[disabled]{opacity:.75;cursor:not-allowed}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pcard .nm{font-size:16px;font-weight:700}
.pcard .sub{font-size:12.5px;color:var(--muted)}
.pcard .meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-soft)} .p-warn{color:var(--warn);background:var(--warn-soft)} .p-neu{color:var(--muted);background:var(--surface-2);border:1px solid var(--line)} .p-bad{color:var(--bad);background:var(--bad-soft)}
.pcard .go{align-self:flex-start;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px}
.sig{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sig:last-child{border-bottom:0}
.sig b{font-size:14px}
.sig small{display:block;color:var(--muted);font-size:12.5px}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 13px;font-size:13px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.note{font-size:12.5px;color:var(--muted)}
.ctxline{font-size:13.5px}
.ctxline b{font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.kpi small{display:block;color:var(--muted);font-size:12.5px}
.kpi b{display:block;font-size:20px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi.paid{background:linear-gradient(135deg,#1e9bd6,#3cc68f);color:#fff;border:0}
.kpi.paid small{color:rgba(255,255,255,.9)}
.spec{border:1px dashed var(--line-strong);border-radius:12px;padding:14px 16px;background:var(--surface-2)}
.spec h3{margin:0 0 6px;font-size:15px}
.spec table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.spec td,.spec th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.spec th{font-weight:500;color:var(--muted);font-size:12px}
.tblwrap{overflow-x:auto}

/* Decisions rail */
.rail{background:var(--surface);border-left:1px solid var(--line);padding-block:18px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail h4{margin:0 0 4px;font-size:14px}
.rail .intro{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.dgrp{margin-bottom:14px}
.dgrp h5{margin:0 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.drow{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px}
.drow.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.drow .q{font-size:12.5px;margin-bottom:6px}
.drow .why{font-size:11.5px;color:var(--muted);margin-top:6px}
.opts{display:flex;flex-wrap:wrap;gap:4px}
.opts button{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:20px;padding:3px 9px;font-size:11.5px}
.opts button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.opts button .rec{font-size:9.5px;font-weight:700;color:var(--ok);margin-left:3px}
.copyrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 6px}
.status{font-size:12.5px;font-weight:700;border-radius:8px;padding:7px 10px}
.status.draft{background:var(--warn-soft);color:var(--warn)}
.status.locked{background:var(--ok-soft);color:var(--ok)}
.where{font-size:11.5px;color:var(--muted);margin:0 0 12px}
.qn{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;margin-right:6px}
.drow .q{font-size:13px;font-weight:500;line-height:1.4}
.drow.locked .opts button[aria-pressed="false"]{opacity:.45}
.opts button[disabled]{cursor:default}
.chg{color:var(--warn);font-weight:700}
.lockbtn{margin-left:auto;border:1px solid var(--line-strong);background:var(--surface);border-radius:20px;width:34px;height:28px;font-size:14px;line-height:1;display:inline-grid;place-items:center}
.lockbtn.on{background:var(--ok-soft);border-color:var(--ok)}
.lockbtn[disabled]{opacity:.6;cursor:default}
.opts{align-items:center}
.note-in{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:inherit;font-size:12px;color:var(--ink);background:var(--surface);resize:vertical}
.nsaved{font-size:11px;color:var(--ok);margin-top:3px;min-height:14px}
.nsaved.bad{color:var(--bad)}
.notev{margin-top:6px;font-size:12px;background:var(--surface-2);border-radius:6px;padding:6px 8px}
/* Policy screens */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:8px}
.card2.wide{grid-column:1 / -1}
.card2 h3{margin:0;font-size:15px}
.card2 .note{margin:0}
.duev{font-size:22px;font-weight:700}
.duev.ok{color:var(--ok)}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sel{border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink);font-family:inherit;font-size:13.5px;min-width:180px}
.callout{background:var(--warn-soft);border-radius:8px;padding:9px 11px;font-size:12.5px}
.lockn{border:1px dashed var(--line-strong);border-radius:10px;padding:12px 14px;color:var(--muted);font-size:13px;background:var(--surface-2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;text-transform:uppercase;letter-spacing:.03em}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
table.dt{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}
table.dt th{text-align:left;font-weight:500;color:var(--muted);background:var(--surface-2);padding:9px 10px;border-bottom:1px solid var(--line)}
table.dt td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.dt.kv2{min-width:0}
table.dt.kv2 thead{display:none}
table.dt.kv2 td:last-child{text-align:right;font-weight:500}
.search{border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--faint);font-size:13px;max-width:320px}
.lnk{color:var(--accent);font-weight:500}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.minis div{background:var(--surface-2);border-radius:8px;padding:8px}
.minis small{display:block;font-size:11.5px;color:var(--muted)}
.minis b{font-size:14px}
.spark{width:100%;max-width:100%;height:auto;background:var(--surface-2);border-radius:8px}
.ul{margin:0;padding-left:18px;font-size:13px}
.oq{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px;padding:14px 18px}
.oq h3{margin:0 0 6px;font-size:15px}
.oq ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.dtab summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:500;padding:4px 0}
.dtab[open] summary{margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;z-index:30}
</style>

<div class="mockbar">
  <button class="reset" onclick="location.reload()">↺ Start over (reset the mock)</button>
  <span class="mocklabel">Logged in as</span>
  <div class="chips" id="who">
    <button data-w="entity" aria-pressed="true">Entity signer · 3 policies</button>
    <button data-w="family" aria-pressed="false">Individual settlor · 3 family policies</button>
    <button data-w="individual" aria-pressed="false">Individual settlor · 1 policy</button>
  </div>
  <span class="mocktag">Settlor Servicing Portal · first draft · sample data only · W-SETTLOR</span>
</div>

<div class="shell">
  <nav class="nav" id="nav" aria-label="Settlor Servicing Portal"></nav>
  <main class="main" id="main"></main>
  <aside class="rail" id="rail" aria-label="What can the settlor do"></aside>
</div>
<div id="toastRoot"></div>

<script>
/* ---------- Sample data (fake) ---------- */
var PEOPLE = {

    policies:[
      {id:"KZ-104233", insured:"Daniel Reyes", product:"Kai-Zen · National Life (LSW)", tranche:79, inforce:true, year:3, paid:true, growth:"5.25%", ndb:"$1,584,955.77", cv:"$96,760.82", anniv:"11/03/2026",

    policies:[
      {id:"KZ-106410", insured:"Ethan Alvarez", product:"Kai-Zen · National Life (LSW)", tranche:84, inforce:true, year:2, paid:true, growth:"5.10%", ndb:"$1,250,000.00", cv:"$38,412.60", anniv:"03/01/2027", sign:[{what:"Hold Harmless renewal", due:"Dec 1, 2026"}]},
      {id:"KZ-106411", insured:"Olivia Alvarez", product:"Kai-Zen · National Life (LSW)", tranche:84, inforce:true, year:2, paid:false, growth:"5.10%", ndb:"$1,250,000.00", cv:"$37,980.15", anniv:"03/01/2027", contrib:"Contribution due Mar 1, 2027", sign:[]},
      {id:"KZ-106972", insured:"Noah Alvarez", product:"Kai-Zen · Allianz", tranche:86, inforce:false, sign:[]}
    ]},
  individual: {first:"Maria", last:"Reyes", title:"Settlor", settlor:"Maria Reyes", kind:"individual", rel:"Spouse of the insured", email:"maria.reyes@example.com",
    policies:[
      {id:"KZ-104233", insured:"Daniel Reyes", product:"Kai-Zen · National Life (LSW)", tranche:79, inforce:true, year:3, paid:true, growth:"5.25%", ndb:"$1,584,955.77", cv:"$96,760.82", anniv:"11/03/2026",
        sign:[{what:"Death Benefit Reduction election + Hold Harmless", due:"Dec 15, 2026"}]}
    ]}
};

/* ---------- Screens + proposed settlor permissions (Jamin decides) ----------
   Each question: options, recommended option, and why. */
var OPTS = ["Yes","View only","No","Not decided"];
/* Every question is about the AUTHORIZED SIGNER: the one person who logs in to the Settlor Servicing Portal
   (the settlor themself, or the person who signs for an entity settlor). */
var DECISIONS = [
  {g:"Portal level", items:[
    {k:"home",   screen:"home",  q:"When the authorized signer logs in, should they land on a home screen that lists every policy they sign for, and pick one to see its details? (Even if they have only one policy.)", rec:"Yes", why:"No money figures show until they pick a policy."},
    {k:"sign",   screen:"sign",  q:"Should the authorized signer have one list of everything waiting for their signature, across all their policies, and sign it in DocuSign?", rec:"Yes", why:"This is the main reason the authorized signer is in ILIA."},
    {k:"profile",screen:"profile",q:"Can the authorized signer update their OWN contact details (email, phone, address)?", rec:"Yes", why:"Their own record, not the insured’s. A new email may need NIW approval, since forms and invites go there."}
  ]},
  {g:"Per policy (after picking one)", items:[
    {k:"dash",  screen:"dash",  q:"Can the authorized signer see the policy’s values: paid status, growth rate, net death benefit, cash value and anniversary date?", rec:"View only", why:"The same cards the insured sees today."},
    {k:"payV",  screen:"pay",   q:"Can the authorized signer see the policy’s contribution history and what’s due next?", rec:"View only", why:"So they know when a contribution is coming."},
    {k:"payA",  screen:"pay",   q:"Can the authorized signer MAKE a contribution payment for the policy from the portal?", rec:"Not decided", why:"ILIA’s Kai-Zen FAQ and wire instructions already allow funds from the insured’s or the settlor’s personal account."},
    {k:"payB",  screen:"pay",   q:"Can the authorized signer see the INSURED’s saved bank accounts?", rec:"No", why:"That’s the insured’s own financial information."},

        '<div class="callout">ILIA’s Kai-Zen FAQ says the settlor decides who the beneficiaries are. Today, though, the insured edits and signs beneficiary changes (open question 1).</div></div>';
      return '<div class="grid2">'+basic+bens+'</div>';
    }},
  claims:{title:"Claims & Distributions",today:"Two cards: Make a Claim Request and Distribution Request. Each opens a single free-text “Details” box. No types, no steps, no signing. Available once the loan is paid off.",
    sub:function(pol){return "Claim or distribution requests for "+esc(pol.insured)+"’s policy. Available once the bank loan is paid off.";},
    body:function(pol){
      var st=sees("clV")?'<div class="card2 wide"><h3>Your requests</h3>'+table(["Type","Sent","Status"],[["—","—","No requests yet"]])+'</div>':lockedNote("Request status is hidden for settlors.");
      return '<div class="grid2"><div class="card2"><h3>Make a Claim Request</h3><p class="note">For example a death claim. Usually handled with the trustee and beneficiaries.</p>'+gateBtn("clA","Claim Request")+'</div>'+
        '<div class="card2"><h3>Distribution Request</h3><p class="note">Policy loans or withdrawals after the bank loan is paid off.</p>'+gateBtn("clA","Make Distributions Request")+'</div></div>'+st+
        (choice.clA==="No"||choice.clA==="View only"?'<p class="note">Claims and distributions are requested by the insured.</p>':'');
    }}
};
function spark(){return '<svg viewBox="0 0 300 90" class="spark" role="img" aria-label="Illustrated versus actual cash value, years 1 to 8"><polyline fill="none" stroke="var(--faint)" stroke-dasharray="4 4" stroke-width="2" points="10,80 45,70 80,58 115,47 150,36 185,27 220,19 255,12 290,6"/><polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="10,80 45,72 80,61 115,52"/><circle cx="115" cy="52" r="3.5" fill="var(--accent)"/><text x="12" y="12" font-size="10" fill="var(--muted)">— actual   - - illustrated</text></svg>';}

/* Open questions under each screen */
var OPENQ={
  home:["One person can be the authorized signer on several policies, for example a parent for each child’s policy. Is the relationship to the insured recorded per policy (Parent / Spouse / Other) or once per settlor?","If an authorized signer has many policies (10 or more), should the home add search, or group the policies by family?","Should a policy that isn’t in force yet show on the home (greyed out), or stay hidden until it’s in force?"],
  dash:["Should the authorized signer see every value card (net death benefit and cash value), or fewer?","Should the dashboard keep the quick-link tiles (Plan Documents, Annual Review, Insured Details, Claims…), filtered to what the authorized signer can use?","When a policy isn’t in force yet, should the authorized signer see a “coming soon” card for it, or nothing?"],
  pay:["Can the authorized signer make contribution payments from the portal? ILIA’s Kai-Zen FAQ and wire instructions already allow funds from the insured’s <b>or the settlor’s</b> personal account.","Entity settlors: today’s rule says personal accounts only, not business or trust accounts. Can an LLC or other entity pay, or must it always be a person?","If the authorized signer pays by ePay, do they save their own bank account in ILIA, kept separate from the insured’s?","Should the authorized signer see Bank Leverage (bank loan amounts) in the history?","Who gets contribution-due reminders and payment receipts: the insured, the signer, or both?","Monthly recurring ePay: if the insured set it up, can the signer see or change it?"],
  docs:["Enrollment documents include the application with the insured’s medical and financial answers. Show a redacted version, a filtered set (policy, illustration, trust), or everything?","Replace “Personal Documents” with “Settlor Documents” (their own uploads) and hide the insured’s ID, utility bill and residence documents?","What can an authorized signer upload (trust, entity or ID documents), and who at NIW reviews it?","Add a “Signed by me” tab so the signer can find everything they’ve signed? Should the insured see those documents too?"],
  ar:["The Annual Review tile is admin-only today. Is Annual Review live for insureds yet? Should authorized signers get it at the same time?","It shows bank loan amounts and interest. Is that OK for the authorized signer? (The trust owns the policy.)","Can the authorized signer download the carrier annual statement?","If NIW holds annual review calls, is the authorized signer invited, the insured, or both?"],
  perf:["Allocation changes today are a carrier PDF the client emails to NIW, with no signing in ILIA. For a separate settlor, should the signer fill out and sign that form instead of the insured?","Index allocation cards only show for admins today. Show them to the authorized signer?","Allianz “Lock at X%”: can the signer request a lock?","If policy performance moves to “Monitor” or “Check-In”, who is told: insured, signer, or both?"],
  ins:["ILIA’s FAQ says the settlor decides the beneficiaries, but today the insured edits and signs beneficiary changes. For a separate settlor, who requests and signs: the signer, the insured, or both?","Which insured details can the authorized signer see? Proposal: name, masked date of birth, city and state only.","Confirm: legal name and personal detail changes stay with the insured (insured signs).","If the insured has no portal access, how do they change their own details? By calling NIW?"],
  claims:["Who can request a distribution on a trust-owned policy: the signer, the insured, or both? (Per the FAQ, surrender funds go to the insured or settlor.)","Death claims usually come from the trustee and beneficiaries. Should the authorized signer portal offer “Claim Request” at all?","Today a request is a free-text box with no signature. Should a settlor’s request require their DocuSign signature?","Who is notified and approves: the trustee (Provident) or NIW operations?"]
};
function openQ(s){var q=OPENQ[s]; if(!q) return ""; return '<div class="oq"><h3>Open questions for this screen</h3><ol>'+q.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ol></div>';}

/* ---------- Decisions rail: answer, note, save & lock ---------- */
/* Storage: the Claude Artifact page saves to its shared database (Claude can read it back to log it).
   Anywhere else (e.g. GitHub Pages) it saves in this browser only. */
var DOC_PATH="portal/decisions", store=null, storeMode="local", saving=false;
function nowLabel(){var d=new Date();return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})+" "+d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});}
function applyRecord(r){ if(!r) return; if(r.choices) Object.keys(r.choices).forEach(function(k){if(k in choice) choice[k]=r.choices[k];});
  if(r.notes) Object.keys(r.notes).forEach(function(k){if(k in notes) notes[k]=r.notes[k];}); rowLock={}; if(r.rowLocks) Object.keys(r.rowLocks).forEach(function(k){rowLock[k]=!!r.rowLocks[k];}); saved.locked=!!r.locked; saved.savedAt=r.savedAt||null; }
function record(lock){return {choices:Object.assign({},choice), notes:Object.assign({},notes), rowLocks:Object.assign({},rowLock), locked:lock, savedAt:nowLabel(), updatedAt:new Date().toISOString(),
  answers:DECISIONS.reduce(function(a,g){g.items.forEach(function(d){a.push({key:d.k,question:d.q,answer:choice[d.k],suggested:d.rec,note:notes[d.k]||"",locked:lock||!!rowLock[d.k]});});return a;},[])};}
function persist(lock,msg){
  var r=record(lock);
  if(store){ saving=true; renderRail(); return store.doc(DOC_PATH).set(r).then(function(){saving=false;applyRecord(r);render();toast(msg||(lock?"Answers saved and locked":"Unlocked for editing"));},function(){saving=false;renderRail();toast("Couldn’t save. Try again.");}); }
  try{ localStorage.setItem("settlorPortalDecisions",JSON.stringify(r)); }catch(e){}
  applyRecord(r); render(); toast(msg||(lock?"Saved and locked (this browser only)":"Unlocked for editing"));
}
(function initStore(){
  try{ var raw=localStorage.getItem("settlorPortalDecisions"); if(raw){applyRecord(JSON.parse(raw)); render();} }catch(e){}
  if(window.claude && window.claude.use){
    window.claude.use("db").then(function(db){
      if(!db) return; store=db; storeMode="shared";
      db.doc(DOC_PATH).onSnapshot(function(s){ var ae=document.activeElement; if(ae && ae.classList && ae.classList.contains('note-in')) return; if(s.exists && !saving){ applyRecord(s.data()); render(); } else renderRail(); }, function(){ store=null; storeMode="local"; renderRail(); });
    }, function(){});
  }
})();
function renderRail(){
  var cur=view, L=saved.locked, n=0, total=0, nl=0; DECISIONS.forEach(function(g){g.items.forEach(function(d){total++; if(rowLock[d.k]) nl++;});});
  var status = L ? '<div class="status locked">🔒 Locked · saved '+esc(saved.savedAt)+'</div>' : '<div class="status draft">'+(saved.savedAt?'Editing · '+nl+' of '+total+' questions locked · last saved '+esc(saved.savedAt):'Draft · not saved yet')+'</div>';
  var where = storeMode==="shared" ? 'Saved to this page’s shared record. Claude can read it back to log it.' : 'Saving in <b>this browser only</b> here. To save for the team (and so Claude can log it), use the Claude Artifact link.';
  var h='<h4>What can the authorized signer do?</h4>'+
    '<p class="intro">The <b>authorized signer</b> is the one person who logs in here: the settlor themself, or the person who signs for an entity settlor. My suggestion is pre-selected. Ask each question, pick the answer, add a note, then <b>Save &amp; lock</b>.</p>'+
    status+'<div class="copyrow">'+(L?'<button class="btn sm" data-act="unlock">Unlock to edit</button>':'<button class="btn sm primary" data-act="save"'+(saving?' disabled':'')+'>'+(saving?'Saving…':'Save &amp; lock answers')+'</button><button class="btn sm" data-act="resetdec">Reset to suggestions</button>')+'<button class="btn sm" data-act="copy">Copy answers</button></div>'+
    '<p class="where">'+where+'</p>';
  DECISIONS.forEach(function(g){
    h+='<div class="dgrp"><h5>'+g.g+'</h5>'+g.items.map(function(d){ n++;
      var changed=choice[d.k]!==d.rec, RL=L||!!rowLock[d.k];
      return '<div class="drow'+(d.screen===cur?' cur':'')+(RL?' locked':'')+'"><div class="q"><span class="qn">'+n+'</span>'+esc(d.q)+'</div>'+
        '<div class="opts">'+OPTS.map(function(o){return '<button data-dk="'+d.k+'" data-dv="'+o+'" aria-pressed="'+(choice[d.k]===o)+'"'+(RL?' disabled':'')+'>'+o+'</button>';}).join("")+'<button class="lockbtn'+(RL?' on':'')+'" data-lk="'+d.k+'" aria-pressed="'+RL+'" title="'+(L?'Everything is locked. Use Unlock to edit.':RL?'Unlock this question':'Lock this question')+'" aria-label="'+(RL?'Unlock':'Lock')+' question '+n+'"'+(L?' disabled':'')+'>'+(RL?'\ud83d\udd12':'\ud83d\udd13')+'</button></div>'+
        '<div class="why"><b>Suggested:</b> '+esc(d.rec)+(changed?' · <span class="chg">changed</span>':'')+(d.why?' — '+esc(d.why):'')+'</div>'+
        (RL ? (notes[d.k]?'<div class="notev">📝 '+esc(notes[d.k])+'</div>':'')
           : '<textarea class="note-in" id="note-'+d.k+'" data-nk="'+d.k+'" rows="1" placeholder="Note from the call (saves automatically)">'+esc(notes[d.k])+'</textarea><div class="nsaved" id="ns-'+d.k+'">'+(notes[d.k]?'Saved \u2713':'')+'</div>')+
      '</div>';
    }).join("")+'</div>';
  });
  document.getElementById("rail").innerHTML=h;
}
function decisionsText(){
  var out=["Settlor Servicing Portal — what the authorized signer can do",(saved.locked?"Locked · saved "+saved.savedAt:"Draft (not saved)"),""], n=0;
  DECISIONS.forEach(function(g){out.push(g.g.toUpperCase());g.items.forEach(function(d){n++;out.push(n+". "+d.q);out.push("   Answer: "+choice[d.k]+(choice[d.k]!==d.rec?"  (suggested: "+d.rec+")":""));if(notes[d.k])out.push("   Note: "+notes[d.k]);});out.push("");});
  return out.join("\n");
}
var noteTimers={};
function markNote(k,txt,bad){var el=document.getElementById('ns-'+k); if(el){el.textContent=txt; el.className='nsaved'+(bad?' bad':'');}}
function saveNoteQuiet(k){
  var r=record(saved.locked); var t=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  if(store){ saving=true; store.doc(DOC_PATH).set(r).then(function(){saving=false; saved.savedAt=r.savedAt; markNote(k,'Saved \u2713 '+t);}, function(){saving=false; markNote(k,'Not saved. Check your connection and type again.',true);}); return; }
  try{ localStorage.setItem('settlorPortalDecisions',JSON.stringify(r)); saved.savedAt=r.savedAt; markNote(k,'Saved \u2713 '+t+' (this browser)'); }catch(e){ markNote(k,'Not saved in this browser.',true); }
}
document.addEventListener("input",function(ev){ var t=ev.target; if(t.dataset && t.dataset.nk){ var k=t.dataset.nk; notes[k]=t.value; markNote(k,'Saving\u2026'); clearTimeout(noteTimers[k]); noteTimers[k]=setTimeout(function(){saveNoteQuiet(k);},1200); } });

/* ---------- Events ---------- */
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-nav],[data-pick],[data-act],[data-dk],[data-w],[data-tab],[data-lk]"); if(!t) return;
  if(t.dataset.lk){ if(saved.locked) return; var k=t.dataset.lk; rowLock[k]=!rowLock[k]; var keep=document.getElementById("rail").scrollTop; persist(false, rowLock[k]?"Question locked and saved":"Question unlocked"); setTimeout(function(){document.getElementById("rail").scrollTop=keep;},0); return; }
  if(t.dataset.tab){ tabState[t.dataset.tab]=+t.dataset.ti; render(); return; }
  if(t.dataset.w){ who=t.dataset.w; [].forEach.call(document.querySelectorAll("#who button"),function(b){b.setAttribute("aria-pressed",b===t?"true":"false");});
    pol=null; view="home"; render(); return; }
  if(t.dataset.nav){ var v=t.dataset.nav; if(v==="home"){pol=null;} view=v; render(); window.scrollTo(0,0); return; }
  if(t.dataset.pick){ pol=P().policies.filter(function(x){return x.id===t.dataset.pick;})[0]; view="dash"; render(); window.scrollTo(0,0); return; }
  if(t.dataset.dk){ choice[t.dataset.dk]=t.dataset.dv; var keep=document.getElementById("rail").scrollTop; render(); document.getElementById("rail").scrollTop=keep; return; }
  var a=t.dataset.act;
  if(a==="signdoc") toast("Mock: opens the document in DocuSign");
  if(a==="mock") toast("Mock: opens an edit form");
  if(a==="save"){ persist(true); }
  if(a==="unlock"){ persist(false); }
  if(a==="resetdec"&&!saved.locked){ DECISIONS.forEach(function(g){g.items.forEach(function(d){if(!rowLock[d.k]) choice[d.k]=d.rec;});}); render(); toast("Unlocked questions reset to suggestions"); }
  if(a==="copy"){ var txt=decisionsText();
    try{ navigator.clipboard.writeText(txt).then(function(){toast("Decisions copied");},function(){toast("Copy blocked. Select the text in the panel instead.");}); }catch(e){ toast("Copy blocked."); } }
});
render();
</script>
